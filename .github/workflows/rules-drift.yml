name: Rules drift vs gitleaks

on:
  schedule:
    # 06:17 UTC on the 1st of every month
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rules-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run drift check
        id: drift
        run: |
          set +e
          python scripts/rules_drift.py > report.md
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "--- report ---"
          cat report.md
          # 0 = no drift, 1 = drift (handled below); anything else is a real failure
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            exit "$code"
          fi

      - name: Open or update drift issue
        if: steps.drift.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Detection rules drift vs gitleaks"
          existing=$(gh issue list --state open --search "in:title \"$title\"" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file report.md
            gh issue comment "$existing" \
              --body "Drift check re-ran on $(date -u +%Y-%m-%d) and still finds drift; issue body refreshed."
          else
            gh issue create --title "$title" --body-file report.md
          fi

      - name: Fail job so drift is visible in CI
        if: steps.drift.outputs.exit_code == '1'
        run: |
          echo "Rules drift detected vs gitleaks - see the issue created/updated above."
          exit 1
