# PyPI Trusted Publisher setup required
# Before this workflow can publish, configure a trusted publisher at:
#   https://pypi.org/manage/project/agentsweep/settings/publishing/
# Use these values:
#   Owner:         ishan (your GitHub username)
#   Repository:    agentsweep
#   Workflow name: publish.yml
#   Environment:   (leave blank, or match the `environment:` field below if you add one)

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI (trusted publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
